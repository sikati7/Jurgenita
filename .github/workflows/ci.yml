name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un échec sous un système n'interrompt pas les autres : on voit tout.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        # macOS (sous-étape 2b.4) : un seul job, Node 22.
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Garde-fou : sous Windows, les tests propres à Windows (dont les vrais
      # verrous NTFS de la sous-étape 2b.3) doivent avoir TOUS réellement tourné :
      # nombre exact attendu, tous réussis, aucun ignoré.
      # Sous PowerShell, comme un lancement réel de Jurgenita : Git Bash active
      # les privilèges de sauvegarde et de restauration des administrateurs,
      # qui contournent les règles de refus que ces tests posent.
      - name: Tests Windows réellement exécutés
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TESTS_WINDOWS_ATTENDUS: 23
        run: |
          node --test test/windows.test.js | Tee-Object -FilePath windows-tests.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $lignes = Get-Content windows-tests.txt
          foreach ($attendu in "# tests $env:TESTS_WINDOWS_ATTENDUS", "# pass $env:TESTS_WINDOWS_ATTENDUS", "# fail 0", "# skipped 0") {
            if ($lignes -notcontains $attendu) { Write-Output "Ligne attendue absente : $attendu"; exit 1 }
          }
      # Garde-fou 2b.4 : sous Linux et macOS (comptes non root en CI), le vrai
      # refus d'accès doit avoir réellement tourné ; sous macOS, l'ACL réelle aussi.
      - name: Tests 2b.4 réellement exécutés (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node --test test/secret-dir.test.js | tee secret-dir-tests.txt
          grep -q "^# fail 0$" secret-dir-tests.txt
          grep -E "^ok [0-9]+ - POSIX \(réel\) : dossier interdit" secret-dir-tests.txt | grep -vq "# SKIP"
          if [ "$RUNNER_OS" = "macOS" ]; then grep -E "^ok [0-9]+ - macOS \(réel\)" secret-dir-tests.txt | grep -vq "# SKIP"; fi
      # 2b.4 : aucune sauvegarde de droits laissée par les tests hors de leurs
      # dossiers temporaires (ni dossier partagé, ni dossier de test oublié).
      - name: Sauvegardes des tests nettoyées (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tmp=$(node -p "require('os').tmpdir()")
          restes=$(ls -A "$tmp" | grep -E '^(secret-permissions-backups$|jurgenita-.*sauvegardes)' || true)
          if [ -n "$restes" ]; then echo "Restes dans $tmp : $restes"; exit 1; fi
          echo "Aucune sauvegarde de test laissée dans $tmp."
      - name: Sauvegardes des tests nettoyées (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = node -p "require('os').tmpdir()"
          $restes = @(Get-ChildItem -LiteralPath $tmp -Force | Where-Object { $_.Name -eq 'secret-permissions-backups' -or $_.Name -match '^jurgenita-.*sauvegardes' })
          if ($restes.Count -gt 0) { Write-Output ('Restes dans ' + $tmp + ' : ' + (($restes | ForEach-Object Name) -join ', ')); exit 1 }
          Write-Output ('Aucune sauvegarde de test laissée dans ' + $tmp + '.')
