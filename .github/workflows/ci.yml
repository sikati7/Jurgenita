name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un échec sous un système n'interrompt pas les autres : on voit tout.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Garde-fou : sous Windows, les tests propres à Windows (dont les vrais
      # verrous NTFS de la sous-étape 2b.3) doivent avoir TOUS réellement tourné :
      # nombre exact attendu, tous réussis, aucun ignoré.
      - name: Tests Windows réellement exécutés
        if: runner.os == 'Windows'
        shell: bash
        env:
          TESTS_WINDOWS_ATTENDUS: 9
        run: |
          node --test test/windows.test.js | tee windows-tests.txt
          grep -q "^# tests ${TESTS_WINDOWS_ATTENDUS}$" windows-tests.txt
          grep -q "^# pass ${TESTS_WINDOWS_ATTENDUS}$" windows-tests.txt
          grep -q "^# fail 0$" windows-tests.txt
          grep -q "^# skipped 0$" windows-tests.txt
