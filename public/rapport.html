<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport de performance</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --text: #1d1d1f; --muted: #6b6b70; --line: #e6e3dc; --accent: #0e7490; --bg: #fff; --soft: #f7f6f2; --red: #b91c1c; --green: #15803d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eceae4; color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page { max-width: 860px; margin: 24px auto; background: var(--bg); padding: 44px 48px; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.08); }
    header { border-bottom: 3px solid var(--accent); padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; }
    h2 { font-size: 17px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 30px 0 12px; break-after: avoid; }
    .muted { color: var(--muted); }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .tile { background: var(--soft); border-radius: 10px; padding: 12px 14px; break-inside: avoid; }
    .tile .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .tile .value { font-size: 24px; font-weight: 700; }
    .tile .delta { font-size: 13px; color: var(--green); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    .resume { font-size: 16px; background: var(--soft); border-left: 4px solid var(--accent); padding: 14px 18px; border-radius: 0 10px 10px 0; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 4px 0; }
    .bad { color: var(--red); }
    .toolbar { max-width: 860px; margin: 16px auto 0; display: flex; justify-content: flex-end; gap: 10px; padding: 0 16px; }
    .toolbar button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    @media (max-width: 700px) { .page { padding: 24px 18px; margin: 12px; } .cols { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { box-shadow: none; margin: 0; max-width: none; padding: 0; }
      @page { margin: 16mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><button id="print">⬇ Enregistrer en PDF</button></div>
  <article class="page" id="report"><p class="muted">Préparation du rapport par Jurgenita…</p></article>
  <script>
    "use strict";
    const marque = new URLSearchParams(location.search).get("marque") || "";
    document.getElementById("print").addEventListener("click", () => window.print());

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) if (v != null && v !== false) node.setAttribute(k, v);
      for (const c of children.flat()) if (c != null && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
      return node;
    }
    const n = (x) => Number(x ?? 0).toLocaleString("fr-FR");
    const euro = (x) => `${Number(x ?? 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
    const list = (items) => el("ul", {}, (items || []).map((i) => el("li", {}, i)));

    async function load() {
      const res = await fetch(`/api/rapport?marque=${encodeURIComponent(marque)}`);
      const data = await res.json().catch(() => ({}));
      const root = document.getElementById("report");
      if (!res.ok) { root.replaceChildren(el("p", {}, data.erreur || "Rapport indisponible.")); return; }
      const { donnees: d, analyse: a } = data;
      document.title = `Rapport · ${d.marque}`;
      const platforms = Object.entries(d.statistiques.plateformes);
      const ads = d.publicite.annonces;
      // Ignore les sections vides et aplatit les groupes d'éléments.
      root.replaceChildren(...[
        el("header", {},
          el("h1", {}, `Rapport de performance · ${d.marque}`),
          el("div", { class: "muted" }, `${d.statistiques.periode} · généré le ${new Date(d.genere_le).toLocaleDateString("fr-FR", { dateStyle: "long" })}`)),
        el("p", { class: "resume" }, a.resume),

        el("h2", {}, "Audience"),
        platforms.length ? el("div", { class: "tiles" }, platforms.map(([name, p]) => el("div", { class: "tile" },
          el("div", { class: "label" }, name),
          el("div", { class: "value" }, n(p.abonnes)),
          p.evolution_abonnes != null ? el("div", { class: "delta" }, `+${n(p.evolution_abonnes)} abonnés`) : null,
          p.taux_engagement != null ? el("div", { class: "muted" }, `${String(p.taux_engagement).replace(".", ",")} % d'engagement`) : null)))
          : el("p", { class: "muted" }, "Pas encore de statistiques connectées."),
        platforms.some(([, p]) => p.meilleur_post) ? el("table", { style: "margin-top:14px" },
          el("thead", {}, el("tr", {}, el("th", {}, "Plateforme"), el("th", {}, "Meilleur contenu"))),
          el("tbody", {}, platforms.filter(([, p]) => p.meilleur_post).map(([name, p]) => el("tr", {}, el("td", {}, name), el("td", {}, p.meilleur_post))))) : null,

        el("h2", {}, "Communauté et contenus"),
        el("div", { class: "tiles" },
          el("div", { class: "tile" }, el("div", { class: "label" }, "Interactions traitées"), el("div", { class: "value" }, n(d.communaute.interactions))),
          ...Object.entries(d.communaute.par_type).map(([t, c]) => el("div", { class: "tile" }, el("div", { class: "label" }, t), el("div", { class: "value" }, n(c)))),
          el("div", { class: "tile" }, el("div", { class: "label" }, "Contenus publiés"), el("div", { class: "value" }, n(d.contenus.publies))),
          el("div", { class: "tile" }, el("div", { class: "label" }, "Contenus planifiés"), el("div", { class: "value" }, n(d.contenus.planifies)))),

        el("h2", {}, "Publicité"),
        ads.length ? [
          el("div", { class: "tiles" },
            el("div", { class: "tile" }, el("div", { class: "label" }, "Budget dépensé"), el("div", { class: "value" }, euro(d.publicite.total_depense))),
            el("div", { class: "tile" }, el("div", { class: "label" }, "Conversions"), el("div", { class: "value" }, n(d.publicite.total_conversions)))),
          el("table", { style: "margin-top:14px" },
            el("thead", {}, el("tr", {}, el("th", {}, "Annonce"), el("th", { class: "n" }, "Dépense"), el("th", { class: "n" }, "Clics"), el("th", { class: "n" }, "CTR"), el("th", { class: "n" }, "Conv."), el("th", { class: "n" }, "ROAS"))),
            el("tbody", {}, ads.map((x) => el("tr", {},
              el("td", {}, x.annonce),
              el("td", { class: "n" }, euro(x.depense)),
              el("td", { class: "n" }, n(x.clics)),
              el("td", { class: "n" }, `${String(x.ctr).replace(".", ",")} %`),
              el("td", { class: "n" }, n(x.conversions)),
              el("td", { class: `n${x.roas != null && x.roas < 1 ? " bad" : ""}` }, x.roas == null ? "–" : String(x.roas).replace(".", ","))))))]
          : el("p", { class: "muted" }, "Aucune campagne sur la période."),

        el("h2", {}, "Analyse"),
        el("div", { class: "cols" },
          el("div", {}, el("b", {}, "Réussites"), list(a.reussites)),
          el("div", {}, el("b", {}, "Points d'attention"), list(a.points_attention))),
        el("h2", {}, "Recommandations"),
        list(a.recommandations),
        el("h2", {}, "Objectifs de la prochaine période"),
        list(a.objectifs_prochaine_periode),
        el("footer", {}, `Rapport préparé avec Jurgenita pour ${d.marque}.`),
      ].flat().filter(Boolean));
    }
    load();
  </script>
</body>
</html>
